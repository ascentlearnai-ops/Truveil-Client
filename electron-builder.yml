appId: com.truveil.secure
productName: TruveilSecure
protocols:
  - name: Truveil Secure
    schemes:
      - truveil
directories:
  output: dist
files:
  - main.js
  - preload.js
  - package.json
  - assets/**/*
  - src/**/*
  - browser-extension/protocol.js
extraResources:
  - from: browser-extension
    to: browser-extension
    filter:
      - "**/*"
mac:
  icon: assets/mac/icon.icns
  category: public.app-category.business
  minimumSystemVersion: '12.0'
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  artifactName: TruveilSecure-${version}-mac-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: Truveil Secure transcribes your microphone only after you consent and join an interview, including while you use a calling app. End the session to stop capture.
  target:
    - dmg
win:
  icon: assets/truveil.ico
  target:
    - nsis
  artifactName: TruveilSecure-Setup-${version}.${ext}
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
